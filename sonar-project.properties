sonar.projectKey=portfolio
sonar.projectName=portfolio
sonar.sources=app,components,i18n,lib,middleware.ts
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/*.d.ts
sonar.tests=.
sonar.test.inclusions=**/*.test.tsx,**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results.xml

# app/[locale]/{layout,page,not-found}.tsx son composición de página (JSX,
# textos, wiring de next-intl); middleware.ts / i18n/navigation.ts /
# i18n/request.ts son wrappers finos de next-intl; components/ui/** son
# primitivas estilo shadcn/ui (Radix + CVA) sin lógica de negocio propia.
# Nada de esto tiene valor de test unitario. Se siguen analizando por code
# smells/seguridad; solo se excluyen del denominador de cobertura.
sonar.coverage.exclusions=app/**,components/ui/**,i18n/navigation.ts,i18n/request.ts,middleware.ts
